<title>Màn hình làm bài</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE — dùng xong bỏ, không đưa vào main.
  Bản thử bảng "Hiển thị" (nút Aa trên thanh trên): chế độ xem 1 câu / Cả đề, giao diện sáng/tối, cỡ chữ và kiểu chữ nội dung; lưu theo thiết bị (localStorage).
  Câu hỏi cần trả lời: giao diện làm bài trên điện thoại nên trông thế nào?
  Ba biến thể A/B/C trên cùng một trang, chuyển bằng thanh prototype ở đáy (hoặc phím ← →).
  Dữ liệu giả, việc lưu bài và mất mạng chỉ là giả lập. MathJax chỉ dùng cho prototype (bản thật dùng KaTeX).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@400;600&display=swap">
<style>
  /* Layout: một màn hình cố định — thanh trên/dưới bám mép, vùng đọc cuộn bên trong; thanh prototype tách riêng ở đáy */
  :root {
    --bg: #EDF1F3; --surface: #FFFFFF; --surface-2: #F4F7F8; --ink: #13212A; --muted: #566570; --line: #D5DDE2;
    --accent: #0E6E5C; --accent-ink: #FFFFFF; --accent-soft: #DCEFEA;
    --warn: #9A5B00; --warn-soft: #FBEBD0; --danger: #B42318; --danger-soft: #FCE3DF; --flag: #C2410C;
    --scrim: rgba(10, 20, 26, .45); --shadow: 0 -6px 24px rgba(10, 20, 26, .10);
    --proto: #231B3A; --proto-ink: #F1ECFF;
    --font-ui: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-read: "Noto Serif", Georgia, "Times New Roman", serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1519; --surface: #162027; --surface-2: #1C2830; --ink: #E4ECEF; --muted: #97A7B0; --line: #2A3841;
      --accent: #41C2A1; --accent-ink: #052A21; --accent-soft: #143A31;
      --warn: #F2B552; --warn-soft: #3A2B10; --danger: #FF8C7C; --danger-soft: #3D1B17; --flag: #FF9E66;
      --scrim: rgba(0, 0, 0, .6); --shadow: 0 -6px 24px rgba(0, 0, 0, .4);
      --proto: #EFE9FF; --proto-ink: #21183A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1519; --surface: #162027; --surface-2: #1C2830; --ink: #E4ECEF; --muted: #97A7B0; --line: #2A3841;
    --accent: #41C2A1; --accent-ink: #052A21; --accent-soft: #143A31;
    --warn: #F2B552; --warn-soft: #3A2B10; --danger: #FF8C7C; --danger-soft: #3D1B17; --flag: #FF9E66;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 -6px 24px rgba(0, 0, 0, .4);
    --proto: #EFE9FF; --proto-ink: #21183A;
    color-scheme: dark;
  }

  html { box-sizing: border-box; height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #app { height: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); }
  #stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #view { position: absolute; inset: 0; }
  .va { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .main-in { padding-block: 16px 28px; max-width: 640px; margin: 0 auto; }

  /* ── shared atoms ─────────────────────────────── */
  .timer { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .timer.warn { background: var(--warn-soft); color: var(--warn); }
  .timer.crit { background: var(--danger-soft); color: var(--danger); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .save { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .save::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .save[data-kind="saving"]::before { background: var(--muted); animation: pulse .8s infinite; }
  .save[data-kind="pend"] { color: var(--warn); font-weight: 600; }
  .save[data-kind="pend"]::before, .save[data-kind="off"]::before { background: var(--warn); }
  .stem { font-family: var(--font-read); font-size: calc(18px * var(--rs, 1)); line-height: 1.6; text-wrap: pretty; }
  .stem strong { font-weight: 600; }
  .hint { font-size: 13px; color: var(--muted); margin: 14px 0 10px; letter-spacing: .01em; }
  .tex-raw { font-family: var(--font-mono); font-size: .85em; color: var(--muted); }
  mjx-container { font-size: 1.02em; }
  .muted { color: var(--muted); }

  .fig { display: block; width: 100%; max-width: 340px; margin: 14px 0 4px; padding: 8px 8px 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: center; }
  .fig-hint { display: block; font-size: 12px; color: var(--muted); padding-top: 2px; }
  .plot { width: 100%; height: auto; display: block; }
  .plot .gr { stroke: var(--line); stroke-width: 1; }
  .plot .ax { stroke: var(--ink); stroke-width: 1.5; }
  .plot .cv { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
  .plot .dash { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
  .plot .pt { fill: var(--accent); }
  .plot .lb { fill: var(--muted); font-family: var(--font-ui); font-size: 12px; }

  .opts { display: grid; gap: 10px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 12px 14px; text-align: left; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); font-size: calc(17px * var(--rs, 1)); font-family: var(--font-opt, var(--font-ui)); }
  .opt .key { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); font-weight: 600; font-size: 14px; color: var(--muted); }
  .opt .key.sq { border-radius: 7px; }
  .opt .otext { min-width: 0; }
  .opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .opt.on .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .flag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 13px; color: var(--muted); }
  .flag.on { color: var(--flag); border-color: var(--flag); font-weight: 600; }
  .flag.on svg path { fill: currentColor; }

  .essay { width: 100%; min-height: 168px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--font-read); font-size: 16px; line-height: 1.55; resize: vertical; }
  .essay:focus { outline: none; border-color: var(--accent); }
  .count { font-size: 12px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .big { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 20px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 16px; }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* tiles: lưới số câu dùng chung cho các bảng */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
  .tile { position: relative; height: 48px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile.ans { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tile.part { border-color: var(--accent); border-style: dashed; color: var(--accent); }
  .tile.cur { outline: 2px solid var(--ink); outline-offset: 2px; }
  .tile.flg::after, .chip.flg::after { content: ""; position: absolute; top: -1px; right: -1px; border-style: solid; border-width: 0 14px 14px 0; border-color: transparent var(--flag) transparent transparent; border-top-right-radius: 9px; }
  .tile.pend::before, .chip.pend::before { content: ""; position: absolute; top: 5px; left: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px var(--surface); }

  /* sheets & overlays */
  #ovl:empty { display: none; }
  .scrim { position: absolute; inset: 0; z-index: 20; background: var(--scrim); border: 0; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 82%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: var(--shadow); animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } }
  .sheet-in { padding-block: 18px 22px; display: grid; gap: 16px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet-head b, .sheet-title { font-size: 18px; font-weight: 700; margin: 0; }
  .x { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 8px; }
  .grp { display: grid; gap: 8px; }
  .grp-t { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lg { position: relative; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line); background: var(--surface); }
  .lg.ans { background: var(--accent); border-color: var(--accent); }
  .lg.part { border-color: var(--accent); border-style: dashed; }
  .lg.flg { border-color: var(--flag); background: var(--flag); }
  .lg.pend { border-radius: 50%; width: 10px; height: 10px; border: 0; background: var(--warn); }
  .alert { padding: 12px 14px; border-radius: 10px; font-size: 14px; }
  .alert.warn { background: var(--warn-soft); color: var(--warn); font-weight: 500; }
  .sum-row { display: flex; justify-content: space-between; padding-block: 10px; border-block: 1px solid var(--line); font-size: 15px; }
  .sum-block { display: grid; gap: 8px; font-size: 14px; color: var(--muted); }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .state pre { margin: 0; padding: 12px; border-radius: 10px; background: var(--surface-2); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; overflow-x: auto; white-space: pre; }

  .zoom { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--bg); }
  .zoom-bar { display: flex; align-items: center; gap: 8px; padding-block: 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .zoom-bar span { flex: 1; font-weight: 600; }
  .zoom-bar button { min-width: 44px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; }
  .zoom-body { flex: 1; overflow: auto; padding: 16px; touch-action: pan-x pan-y pinch-zoom; }
  .zoom-body > div { margin: 0 auto; background: var(--surface); border-radius: 12px; padding: 8px; }

  .done { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; overflow-y: auto; background: var(--bg); }
  .done-in { max-width: 420px; padding-block: 24px; text-align: center; display: grid; gap: 12px; justify-items: center; }
  .done-mark { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .done h2 { margin: 4px 0 0; font-size: 24px; text-wrap: balance; }
  .done p { margin: 0; }
  .done-sum { width: 100%; margin: 8px 0; display: grid; gap: 0; text-align: left; }
  .done-sum div { display: flex; justify-content: space-between; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
  .done-sum dt { color: var(--muted); } .done-sum dd { margin: 0; font-weight: 600; text-align: right; }

  .toast { position: absolute; z-index: 50; top: 72px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 14px; font-weight: 500; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Variant A · Từng câu một ─────────────────── */
  .A .top { background: var(--surface); border-bottom: 1px solid var(--line); }
  .A .top-in { display: flex; align-items: center; gap: 12px; min-height: 58px; }
  .A .ttl { flex: 1; min-width: 0; }
  .A .ttl b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .A .ttl .save { margin-top: 2px; }
  .A .prog { height: 3px; background: var(--line); }
  .A .prog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .A .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; color: var(--muted); }
  .A .qhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .A .qno { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .A .qno small { font-size: 15px; color: var(--muted); font-weight: 500; }
  .A .qpts { font-size: 13px; color: var(--muted); }
  .A .qhead .flag { margin-left: auto; }
  .A .tf-list { display: grid; }
  .A .tf-row { display: grid; grid-template-columns: 26px 1fr; gap: 10px 8px; padding-block: 14px; border-top: 1px solid var(--line); }
  .A .tf-k { font-weight: 700; color: var(--muted); padding-top: 1px; }
  .A .tf-text { font-family: var(--font-read); font-size: 16px; line-height: 1.55; min-width: 0; }
  .A .seg { grid-column: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .A .seg button { min-height: 46px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
  .A .seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .A .bottom { background: var(--surface); border-top: 1px solid var(--line); }
  .A .nav3 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; padding-block: 10px; }
  .A .nav-btn { min-height: 50px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 16px; }
  .A .nav-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .A .grid-btn { display: grid; justify-items: center; gap: 2px; min-width: 76px; padding: 4px 10px; border: 0; background: transparent; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .mode { flex: none; display: inline-grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
  .mode button { min-height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .mode button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }

  /* ── Variant B · Cuộn liên tục ────────────────── */
  .B .chip-submit { flex: none; height: 38px; margin-left: 6px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .B .top { background: var(--surface); border-bottom: 1px solid var(--line); }
  .B .top-in { display: flex; align-items: center; gap: 12px; min-height: 54px; }
  .B .top-in .save { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .B .link { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 9px 14px; border-radius: 10px; }
  .B .chips { overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--line); }
  .B .chips::-webkit-scrollbar { display: none; }
  .B .chips-in { display: flex; gap: 6px; padding-block: 8px; width: max-content; }
  .B .chip { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
  .B .chip.ans { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .B .chip.part { border-color: var(--accent); border-style: dashed; }
  .B .chip.cur { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .B .chip.flg::after { border-top-right-radius: 50%; }
  .B .paper-head { padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
  .B .paper-head h1 { font-family: var(--font-read); font-size: 21px; margin: 0 0 4px; text-wrap: balance; }
  .B .paper-head p { margin: 0; font-size: 13px; color: var(--muted); }
  .B section { padding-top: 22px; }
  .B h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
  .B .note { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .B .q { padding-block: 18px; border-bottom: 1px solid var(--line); scroll-margin-top: 8px; }
  .B .qhead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .B .qno { font-weight: 700; }
  .B .qpts { font-size: 13px; color: var(--muted); flex: 1; }
  .B .flag { padding: 4px 8px; font-size: 12px; }
  .B .opts.paper { gap: 2px; }
  .B .opt.paper { min-height: 48px; padding: 8px 6px; border: 0; border-radius: 10px; background: transparent; }
  .B .opt.paper.on { background: var(--accent-soft); }
  .B .tf-table { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .B .tf-h, .B .tf-tr { display: grid; grid-template-columns: 1fr 56px 56px; align-items: center; }
  .B .tf-h { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; background: var(--surface-2); padding-block: 6px; }
  .B .tf-tr { border-top: 1px solid var(--line); }
  .B .tf-st { padding: 12px; font-family: var(--font-read); font-size: 16px; line-height: 1.5; min-width: 0; }
  .B .radio { justify-self: center; width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; position: relative; }
  .B .radio::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 2px solid var(--line); }
  .B .radio.on::before { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 45%, transparent 50%); }
  .B .end { padding-block: 28px 8px; display: grid; gap: 12px; text-align: center; }

  /* ── Variant C · Vùng ngón cái ────────────────── */
  .C .top { background: var(--bg); }
  .C .top-in { display: flex; align-items: center; gap: 12px; padding-block: 10px 6px; }
  .C .dots { flex: 1; display: flex; gap: 4px; min-width: 0; }
  .C .dot { flex: 1; position: relative; height: 26px; border: 0; background: transparent; padding: 0; }
  .C .dot::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 6px; border-radius: 3px; background: var(--line); }
  .C .dot.ans::before { background: var(--accent); }
  .C .dot.part::before { background: linear-gradient(90deg, var(--accent) 50%, var(--line) 50%); }
  .C .dot.cur::before { top: 8px; height: 10px; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
  .C .dot.flg::after { content: ""; position: absolute; top: 0; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--flag); }
  .C .dot.pend::before { outline: 2px solid var(--warn); outline-offset: 1px; }
  .C .meta { display: grid; justify-items: end; gap: 2px; }
  .C .meta .timer { padding: 4px 8px; font-size: 16px; }
  .C .eyebrow { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
  .C .stem { font-size: 20px; }
  .C .swipe { margin: 18px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
  .C .dock { background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow); max-height: 58%; overflow-y: auto; }
  .C .dock-in { padding-block: 14px 10px; display: grid; gap: 12px; max-width: 640px; margin: 0 auto; }
  .C .dock .hint { margin: 0; }
  .C .c-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .C .c-opts .opt { min-height: 64px; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px 12px; font-size: 18px; }
  .C .c-opts .opt .key { width: 24px; height: 24px; font-size: 12px; }

      ${ITEMS.map((it, i) => `<button ${qs(it, 'chip', i === S.idx)} data-act="jump" data-i="${i}" aria-label="Câu ${i + 1}">${i + 1}</button>`).join('')}<button class="chip-submit" data-act="submit">Nộp bài</button>
    </div></nav></header>
    <main class="main" data-scroll><div class="main-in gut">
      <div class="paper-head"><h1>${EXAM.title}</h1><p>${EXAM.session}</p><p>${EXAM.candidate}</p></div>
      ${SECS.map(sec => `<section><h2>${sec.title}</h2><p class="note">${sec.note}</p>
        ${ITEMS.map((it, i) => it.sec !== sec.id ? '' : `<article class="q" id="b-${it.id}" data-qi="${i}">
          <div class="qhead"><span class="qno">Câu ${i + 1}.</span><span class="qpts">${pts(it.points)}</span>${flagBtn(it)}</div>
          <div class="stem">${rich(it.stem)}</div>${figure(it)}<div class="hint">${hint(it)}</div>
          ${it.type === 'cluster' ? tfTable(it) : it.type === 'essay' ? essayBox(it) : `<div class="opts paper">${optButtons(it, 'paper')}</div>`}
        </article>`).join('')}</section>`).join('')}
      <div class="end"><p class="muted">Bạn đã trả lời <b data-answered></b>/${ITEMS.length} câu.</p><button class="big primary" data-act="submit">Nộp bài</button></div>
    </div></main></div>`;
}
let bObserver = null;
function mountB() {
  const sc = $('#view [data-scroll]');
  bObserver = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) setCurChip(+e.target.dataset.qi); });
  }, { root: sc, rootMargin: '-25% 0px -65% 0px' });
  document.querySelectorAll('#view article.q').forEach(a => bObserver.observe(a));
}
function setCurChip(i) {
  S.idx = i;
  document.querySelectorAll('#view .chip').forEach((c, j) => { c.dataset.cur = j === i ? 1 : 0; });
  updateChrome();
  const c = document.querySelectorAll('#view .chip')[i];
  if (c) c.parentElement.parentElement.scrollTo({ left: c.offsetLeft - 60, behavior: REDUCED ? 'auto' : 'smooth' });
}
function jumpB(i) {

// ── Biến thể C · Vùng ngón cái ────────────────────
function dockBody(it) {
  if (it.type === 'single' || it.type === 'multi')
    return `<div class="hint">${hint(it)}</div><div class="c-opts opts">${optButtons(it, 'card')}</div>`;
  if (it.type === 'cluster') {
    const v = S.responses[it.id] || {}, k = Math.min(S.cStmt[it.id] || 0, it.statements.length - 1);
    return `<div class="hint">Mệnh đề ${SUBK[k]} · ${k + 1}/${it.statements.length}</div>
      ${it.statements.length > 1 ? `<div class="pills">${it.statements.map((_, j) => `<button class="pill ${j === k ? 'cur' : ''} ${v[j] !== undefined ? 'done' : ''}" data-act="cstmt" data-q="${it.id}" data-k="${j}">${SUBK[j]}</button>`).join('')}</div>` : ''}
      <div class="c-stmt">${rich(it.statements[k])}</div>
      <div class="c-tf">${[['1', 'Đúng'], ['0', 'Sai']].map(([b, label]) => {
        const on = v[k] === (b === '1');
        return `<button class="${on ? 'on' : ''}" data-act="tf" data-q="${it.id}" data-k="${k}" data-v="${b}" aria-pressed="${on}">${label}</button>`;
      }).join('')}</div>`;
  }
  return `<div class="hint">Gõ câu trả lời ở khung phía trên · <span data-count="${it.id}">${(S.responses[it.id] || '').length}</span>/${it.maxLength} ký tự</div>`;
}
function renderC() {
  const it = ITEMS[S.idx], last = S.idx === ITEMS.length - 1;
  return `<div class="va C">
    <header class="top"><div class="top-in gut">
      <div class="dots">${ITEMS.map((x, i) => `<button ${qs(x, 'dot', i === S.idx)} data-act="go" data-i="${i}" aria-label="Câu ${i + 1}"></button>`).join('')}</div>
      <div class="meta"><div class="timer" data-timer aria-label="Thời gian còn lại"></div><div class="save" data-save></div></div>
    </div></header>
    <main class="main" data-scroll data-swipe><div class="main-in gut">
      <div class="eyebrow">Câu ${S.idx + 1}/${ITEMS.length} · ${secOf(it).title.replace(/^Phần [IVX]+\.\s*/, '')} · ${pts(it.points)}</div>
      <div class="stem">${rich(it.stem)}</div>${figure(it)}
      ${it.type === 'essay' ? essayBox(it) : ''}

    </div></main>
    <section class="dock" aria-label="Trả lời"><div class="dock-in gut">
      ${dockBody(it)}
      <div class="dock-nav ${last ? 'last' : ''}">
        <button data-act="prev" aria-label="Câu trước" ${S.idx === 0 ? 'disabled' : ''}>‹</button>
        ${flagBtn(it)}
        ${last ? '<button class="submit" data-act="submit">Nộp bài</button>' : '<button data-act="next" aria-label="Câu sau">›</button>'}
      </div>
    </div></section></div>`;
}
function mountC() {
  const el = $('#view [data-swipe]'); let x0 = 0, y0 = 0;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 50) go(S.idx + (dx < 0 ? 1 : -1));
  }, { passive: true });
}

// ── Lớp phủ: lưới câu, nộp bài, phóng ảnh, trạng thái, đã nộp ──
function gridSheet() {
  return `<button class="scrim" data-act="close" aria-label="Đóng"></button><div class="sheet" role="dialog" aria-label="Danh sách câu"><div class="sheet-in gut">
    <div class="sheet-head"><b>Danh sách câu</b><button class="x" data-act="close">Đóng</button></div>
    ${SECS.map(sec => `<div class="grp"><div class="grp-t">${sec.title}</div><div class="tiles">${ITEMS.map((it, i) => it.sec === sec.id ? tile(it, i) : '').join('')}</div></div>`).join('')}
    <div class="legend"><span><i class="lg ans"></i>Đã làm</span><span><i class="lg part"></i>Làm dở</span><span><i class="lg"></i>Chưa làm</span><span><i class="lg flg"></i>Xem lại</span><span><i class="lg pend"></i>Chưa lưu</span></div>
    <button class="big primary" data-act="submit">Nộp bài</button></div></div>`;
}
function submitSheet() {
  const un = ITEMS.map((it, i) => [it, i]).filter(([it]) => !isAnswered(it));
  const fl = ITEMS.map((it, i) => [it, i]).filter(([it]) => S.flagged[it.id]);
  const pend = pendingCount();
  return `<button class="scrim" data-act="close" aria-label="Đóng"></button><div class="sheet" role="dialog" aria-labelledby="sub-t"><div class="sheet-in gut">
    <h2 id="sub-t" class="sheet-title">Nộp bài?</h2>
    <p class="muted" style="margin:0">Còn <b data-timer-plain></b>. Sau khi nộp, bạn không sửa được bài.</p>
    ${pend ? `<div class="alert warn">${pend} câu chưa lưu lên máy chủ. Kiểm tra kết nối mạng trước khi nộp.</div>` : ''}
    <div class="sum-row"><span>Đã trả lời</span><b><span data-answered></span>/${ITEMS.length} câu</b></div>
    ${un.length ? `<div class="sum-block"><span>Chưa làm hoặc làm dở · chạm để mở</span><div class="tiles">${un.map(([it, i]) => tile(it, i)).join('')}</div></div>` : ''}
    ${fl.length ? `<div class="sum-block"><span>Đã đánh dấu xem lại</span><div class="tiles">${fl.map(([it, i]) => tile(it, i)).join('')}</div></div>` : ''}
    <div class="sheet-actions"><button class="big" data-act="close">Làm tiếp</button><button class="big primary" data-act="confirm-submit">Nộp bài</button></div>
  </div></div>`;
}
function statePanel() {
  return `<button class="scrim" data-act="close" aria-label="Đóng"></button><div class="sheet state" role="dialog" aria-label="Trạng thái prototype"><div class="sheet-in gut">
    <div class="sheet-head"><b>Trạng thái prototype</b><button class="x" data-act="close">Đóng</button></div>
    <pre id="state-pre"></pre></div></div>`;
}
function zoomView() {
  return `<div class="zoom" role="dialog" aria-label="Hình minh họa phóng to"><div class="zoom-bar gut"><span>Hình minh họa · Câu 2</span>
    <button data-act="zoom-out" aria-label="Thu nhỏ">−</button><button data-act="zoom-in" aria-label="Phóng to">+</button><button data-act="close">Đóng</button></div>
    <div class="zoom-body"><div style="width:${Math.round(S.zoom.scale * 100)}%">${parabolaSVG()}</div></div></div>`;
}
function doneView() {
  const d = S.submitted, at = d.at.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }), pend = pendingCount();
  return `<div class="done" role="dialog" aria-labelledby="done-t"><div class="done-in gut">
    <div class="done-mark">${I.check}</div>
    <h2 id="done-t">Đã nộp bài</h2>
    <p>${d.reason === 'timeout' ? 'Hết giờ, hệ thống đã tự nộp bài' : 'Bạn đã nộp bài'} lúc ${at}.</p>
    <dl class="done-sum">
      <div><dt>Đã trả lời</dt><dd>${answeredCount()}/${ITEMS.length} câu</dd></div>
      <div><dt>Phiên thi</dt><dd>${EXAM.session}</dd></div>
      ${pend ? `<div><dt>Chưa kịp lưu</dt><dd>${pend} câu, không được tính</dd></div>` : ''}
    </dl>
    <p class="muted">Kết quả sẽ hiển thị khi Người ra đề công bố. Sau khi công bố, bạn có 72 giờ để gửi phúc khảo.</p>
    <button class="big" data-act="reset">Làm lại prototype</button></div></div>`;
}
function renderOverlays() {
  $('#ovl').innerHTML = S.submitted ? doneView() : S.zoom ? zoomView()
    : S.statePanel ? statePanel() : S.sheet === 'grid' ? gridSheet() : S.sheet === 'display' ? displaySheet() : S.sheet === 'submit' ? submitSheet() : '';
  updateChrome();
}
function renderProto() {
  $('#proto').innerHTML = `<div class="proto-in gut" role="toolbar" aria-label="Điều khiển prototype">
    <div class="proto-row"><button data-act="vprev" aria-label="Biến thể trước">◀</button>
      <div class="proto-label"><small>Prototype · biến thể</small>${S.variant} · ${VNAMES[S.variant]}</div>
      <button data-act="vnext" aria-label="Biến thể sau">▶</button></div>
    <div class="proto-row">
      <button data-act="net" aria-pressed="${!S.online}">${S.online ? 'Ngắt mạng' : 'Đang mất mạng'}</button>
      <button data-act="ff">Tua giờ</button><button data-act="state" aria-pressed="${S.statePanel}">Trạng thái</button><button data-act="reset">Làm lại</button>
    </div></div>`;
}

// ── Vẽ lại & cập nhật phần động ───────────────────
function render() {
  const old = $('#view [data-scroll]'), top = old ? old.scrollTop : 0, keep = S.keepScroll;
  if (bObserver) { bObserver.disconnect(); bObserver = null; }
  $('#view').innerHTML = S.variant === 'A' ? renderA() : S.variant === 'B' ? renderB() : renderC();
  const sc = $('#view [data-scroll]');
  if (sc && keep) sc.scrollTop = top;
  S.keepScroll = false;
  if (S.variant === 'B') mountB();
  if (S.variant === 'C') mountC();
  renderOverlays(); renderProto(); updateChrome();
}
function updateChrome() {
  document.querySelectorAll('[data-timer]').forEach(el => {
    el.innerHTML = I.clock + `<span>${fmt(S.remaining)}</span>`;
    el.classList.toggle('warn', S.remaining <= 300 && S.remaining > 60);
    el.classList.toggle('crit', S.remaining <= 60);
  });
  document.querySelectorAll('[data-timer-plain]').forEach(el => { el.textContent = fmt(S.remaining); });
  const s = saveInfo();
  document.querySelectorAll('[data-save]').forEach(el => { el.dataset.kind = s.k; el.textContent = s.t; });
  document.querySelectorAll('[data-qstate]').forEach(el => {
    const it = ITEMS.find(x => x.id === el.dataset.qstate);
    el.className = [el.dataset.base, qClass(it), el.dataset.cur === '1' ? 'cur' : ''].join(' ').replace(/\s+/g, ' ').trim();
  });
  document.querySelectorAll('[data-answered]').forEach(el => { el.textContent = answeredCount(); });
  document.querySelectorAll('[data-prog]').forEach(el => { el.style.width = (answeredCount() / ITEMS.length * 100) + '%'; });
  const pre = $('#state-pre');
  if (pre) pre.textContent = JSON.stringify({
    variant: `${S.variant} · ${VNAMES[S.variant]}`, currentItem: S.idx + 1, online: S.online, remaining: fmt(S.remaining),
    responses: S.responses, flagged: Object.keys(S.flagged).filter(k => S.flagged[k]), save: S.save,
    submitted: S.submitted ? { reason: S.submitted.reason, at: S.submitted.at.toLocaleTimeString('vi-VN') } : null,
  }, null, 2);
}

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
}
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ── Hành động ─────────────────────────────────────
const saveTimers = {};
function markSaving(id, delay = 450) {
  S.save[id] = 'saving'; updateChrome();
  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(() => { S.save[id] = S.online ? 'saved' : 'pending'; updateChrome(); }, delay);
}
function go(i) {
  if (i < 0 || i >= ITEMS.length) return;
  S.sheet = null;
  if (S.variant === 'B') { renderOverlays(); jumpB(i); return; }
  S.idx = i; render();
}
function switchVariant(d) {
  const idx0 = S.idx;
  S.variant = VARIANTS[(VARIANTS.indexOf(S.variant) + d + VARIANTS.length) % VARIANTS.length];
  S.sheet = null; S.zoom = null;
  try { history.replaceState(null, '', '#' + HASH[S.variant]); } catch (e) {}
  render();
  if (S.variant === 'B') requestAnimationFrame(() => jumpB(idx0));
  try { localStorage.setItem(MODE_KEY, S.variant); } catch (e) {}
  toast(`Chế độ xem: ${S.variant === 'A' ? 'từng câu một' : 'cả đề'}`);
}
function toggleNet() {
  S.online = !S.online;
  if (S.online) {
    const ids = Object.keys(S.save).filter(k => S.save[k] === 'pending');
    ids.forEach((id, n) => markSaving(id, 600 + n * 300));
    toast(ids.length ? `Đã có mạng · đang gửi ${ids.length} câu` : 'Đã có mạng');
  } else toast('Mất mạng · câu trả lời được giữ trên máy');
  renderProto(); updateChrome();
}
function fastForward() {
  S.remaining = S.remaining > 305 ? 305 : S.remaining > 65 ? 65 : Math.min(S.remaining, 8);
  updateChrome(); toast(`Tua tới còn ${fmt(S.remaining)}`);
}
function reset() {
  Object.values(saveTimers).forEach(clearTimeout);
  const v = S.variant; S = initial(); S.variant = v;
  render(); toast('Đã làm lại từ đầu');
}
function submit(reason) {
  S.submitted = { at: new Date(), reason }; S.sheet = null; S.zoom = null; S.statePanel = false;
  renderOverlays(); renderProto();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, q = b.dataset.q, it = ITEMS.find(x => x.id === q);
  switch (a) {
    case 'pick': {
      const i = +b.dataset.i;
      if (it.type === 'multi') { const cur = new Set(S.responses[q] || []); cur.has(i) ? cur.delete(i) : cur.add(i); S.responses[q] = [...cur].sort((x, y) => x - y); }
      else S.responses[q] = i;
      markSaving(q); S.keepScroll = true; render(); break;
    }
    case 'tf': {
      const k = +b.dataset.k;
      S.responses[q] = { ...(S.responses[q] || {}), [k]: b.dataset.v === '1' };
      if (S.variant === 'C' && k < it.statements.length - 1) S.cStmt[q] = k + 1;
      markSaving(q); S.keepScroll = true; render(); break;
    }
    case 'cstmt': S.cStmt[q] = +b.dataset.k; S.keepScroll = true; render(); break;
    case 'flag': S.flagged[q] = !S.flagged[q]; S.keepScroll = true; render(); break;
    case 'prev': go(S.idx - 1); break;
    case 'next': go(S.idx + 1); break;
    case 'go': go(+b.dataset.i); break;
    case 'jump': jumpB(+b.dataset.i); break;
    case 'grid': S.sheet = 'grid'; renderOverlays(); break;
    case 'submit': S.sheet = 'submit'; S.statePanel = false; renderOverlays(); break;
    case 'confirm-submit': submit('candidate'); break;
    case 'close': if (S.zoom) S.zoom = null; else { S.sheet = null; S.statePanel = false; renderProto(); } renderOverlays(); break;
    case 'zoom': S.zoom = { scale: 1.6 }; renderOverlays(); break;
    case 'zoom-in': S.zoom.scale = Math.min(4, S.zoom.scale + 0.5); renderOverlays(); break;
    case 'zoom-out': S.zoom.scale = Math.max(1, S.zoom.scale - 0.5); renderOverlays(); break;
    case 'display': S.sheet = 'display'; S.statePanel = false; renderOverlays(); break;
    case 'theme': PREFS.theme = b.dataset.v; applyPrefs(); renderOverlays(); break;
    case 'size': PREFS.size = +b.dataset.v; applyPrefs(); renderOverlays(); break;
    case 'face': PREFS.face = b.dataset.v; applyPrefs(); renderOverlays(); break;
    case 'mode': if (b.dataset.m !== S.variant) { switchVariant(1); if (S.sheet === 'display') { S.sheet = 'display'; renderOverlays(); } } break;
    case 'vprev': switchVariant(-1); break;
    case 'vnext': switchVariant(1); break;
    case 'net': toggleNet(); break;
    case 'ff': fastForward(); break;
    case 'state': S.statePanel = !S.statePanel; S.sheet = null; renderOverlays(); renderProto(); break;
    case 'reset': reset(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target.closest('[data-essay]'); if (!t) return;
  const id = t.dataset.essay; S.responses[id] = t.value;
  document.querySelectorAll(`[data-count="${id}"]`).forEach(c => { c.textContent = t.value.length; });
  markSaving(id, 1200);
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') switchVariant(-1);
  else if (e.key === 'ArrowRight') switchVariant(1);
  else if (e.key === 'Escape' && (S.zoom || S.sheet || S.statePanel)) { S.zoom ? (S.zoom = null) : (S.sheet = null, S.statePanel = false); renderOverlays(); renderProto(); }
});

setInterval(() => {
  if (S.submitted) return;
  S.remaining--;
  if (S.remaining <= 300 && !S.warned[5]) { S.warned[5] = 1; toast('Còn 5 phút'); vib(200); }
  if (S.remaining <= 60 && !S.warned[1]) { S.warned[1] = 1; toast('Còn 1 phút · kiểm tra lại bài'); vib([150, 80, 150]); }
  if (S.remaining <= 0) { submit('timeout'); return; }
  updateChrome();
}, 1000);

window.__mathReady = () => {
  mathReady = true; texCache.clear();
  try { document.head.appendChild(MathJax.svgStylesheet()); } catch (e) {}
  S.keepScroll = true; render();
};
render();

<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>

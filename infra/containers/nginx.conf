# api chạy cùng pod nên nằm ở localhost:3000.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Hình minh họa (Q141): api kiểm quyền rồi trả `X-Accel-Redirect: /_media/<khóa>`, nginx đọc file từ volume ảnh.
  # Chỉ nội bộ nên không ai gọi thẳng được. Cần mount volume ảnh vào /var/lib/exam/media (chỉ đọc) và đặt
  # MEDIA_DIR=/var/lib/exam/media, MEDIA_ACCEL_PREFIX=/_media cho api. Content-Type và Cache-Control do api đặt.
  # api ghi file với quyền 0600, nên nginx phải chạy cùng uid với api (hoặc volume đặt ACL cho nginx), nếu không ảnh trả 403.
  location /_media/ {
    internal;
    alias /var/lib/exam/media/;
  }

  location /ws/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}

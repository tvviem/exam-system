# Địa chỉ khách thật cho api (Q224, Q235): Cloudflare đặt CF-Connecting-IP, truy cập trực tiếp thì lấy địa chỉ kết nối.
# Không dùng $proxy_add_x_forwarded_for vì nó giữ nguyên giá trị X-Forwarded-For do khách tự gửi (giả mạo IP để né
# giới hạn đăng nhập). Cổng web chỉ gắn vào 127.0.0.1, nên chỉ cloudflared hoặc tiến trình cục bộ gửi tới được.
# Chỉ nhận CF-Connecting-IP có dạng địa chỉ IPv4 hoặc IPv6; giá trị khác (rác, danh sách) bị bỏ, dùng địa chỉ kết nối.
map $http_cf_connecting_ip $client_ip {
  default $remote_addr;
  "~^(?<v4>\d{1,3}(?:\.\d{1,3}){3})$" $v4;
  "~^(?<v6>[0-9a-fA-F:]{2,39})$" $v6;
}

# api chạy cùng pod. Danh sách bản api (một hoặc hai) nằm trong file mount từ máy chủ, do `make prod-scale` ghi và nạp lại
# (mặc định trong ảnh chỉ có localhost:3000). `/api/` chia vòng tròn; `/ws/` chia theo địa chỉ khách để một khách luôn vào
# cùng một bản (Socket.IO nâng cấp từ polling lên WebSocket phải nói chuyện với cùng một tiến trình).
upstream exam_api {
  include /etc/exam-nginx/upstream.conf;
}

upstream exam_ws {
  hash $client_ip consistent;
  include /etc/exam-nginx/upstream.conf;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://exam_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Hình minh họa (Q141): api kiểm quyền rồi trả `X-Accel-Redirect: /_media/<khóa>`, nginx đọc file từ volume ảnh.
  # Chỉ nội bộ nên không ai gọi thẳng được. Cần mount volume ảnh vào /var/lib/exam/media (chỉ đọc) và đặt
  # MEDIA_DIR=/var/lib/exam/media, MEDIA_ACCEL_PREFIX=/_media cho api. Content-Type và Cache-Control do api đặt.
  # api ghi file với quyền 0600, nên nginx phải chạy cùng uid với api (hoặc volume đặt ACL cho nginx), nếu không ảnh trả 403.
  location /_media/ {
    internal;
    alias /var/lib/exam/media/;
  }

  location /ws/ {
    proxy_pass http://exam_ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
